name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }} - Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk xvfb

      - name: Install package
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e .

      - name: Run test suite (Linux with Xvfb)
        if: runner.os == 'Linux'
        run: |
          xvfb-run -a python -m tests.self_test

      - name: Run test suite (Windows & macOS)
        if: runner.os != 'Linux'
        run: |
          python -m tests.self_test

      - name: Verify CLI commands
        run: |
          color-math --version
          python-color-math --version
          color-math --help
          color-math --show-colors --json

  package-check:
    name: Package Build & Metadata Validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip build twine

      - name: Build distributions
        run: |
          python -m build

      - name: Check package metadata with Twine
        run: |
          twine check --strict dist/*
