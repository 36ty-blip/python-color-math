[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "python-color-math"
version = "0.1.0"
description = "Pure Python semantic LaTeX and MathJax colorizer for Obsidian Markdown, KaTeX, and math notes."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "36ty-blip" }]
keywords = ["obsidian", "latex", "math", "markdown", "colorizer", "katex", "mathjax", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Text Processing :: Markup",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/36ty-blip/python-color-math"
Repository = "https://github.com/36ty-blip/python-color-math"
Issues = "https://github.com/36ty-blip/python-color-math/issues"

[project.scripts]
color-math = "color_math.main:main"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["color_math*"]
