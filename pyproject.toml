[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "python-color-math"
version = "0.1.0"
description = "A local semantic LaTeX colorizer for Obsidian Markdown notes."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Aditya" }]
keywords = ["obsidian", "latex", "math", "markdown", "colorizer"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Text Processing :: Markup",
]
dependencies = []

[project.urls]
Repository = "https://github.com/36ty-blip/color-math"
Issues = "https://github.com/36ty-blip/color-math/issues"

[project.scripts]
color-math = "color_math.main:main"
python-color-math = "color_math.main:main"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["color_math*", "python_color_math*"]
