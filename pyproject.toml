[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "python-color-math"
version = "0.2.0"
description = "A fast, local semantic LaTeX colorizer for Markdown, Jupyter, and LaTeX math equations."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Aditya" }]
keywords = ["obsidian", "latex", "math", "markdown", "jupyter", "colorizer", "katex", "mathjax", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Text Processing :: Markup",
    "Topic :: Text Processing :: Markup :: LaTeX",
    "Topic :: Text Processing :: Markup :: Markdown",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/36ty-blip/python-color-math"
Documentation = "https://github.com/36ty-blip/python-color-math#readme"
Repository = "https://github.com/36ty-blip/python-color-math"
Issues = "https://github.com/36ty-blip/python-color-math/issues"
Changelog = "https://github.com/36ty-blip/python-color-math/releases"

[project.scripts]
color-math = "color_math.main:main"
python-color-math = "color_math.main:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
color_math = ["py.typed"]

[tool.setuptools.packages.find]
include = ["color_math*", "python_color_math*"]
